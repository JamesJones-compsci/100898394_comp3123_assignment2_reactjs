server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Redirect all requests to index.html for React Router
    location / {
        try_files $uri /index.html;
    }

    # Optional: serve static assets normally
    location /static/ {
        root /usr/share/nginx/html;
    }
}
